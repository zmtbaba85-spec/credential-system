<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>证书详情</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Ethers.js -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .cert-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 700px;
            width: 90%;
        }
        .cert-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }
        .cert-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #333;
        }
        .cert-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 10px;
        }
        .cert-badge.valid {
            background: #d4edda;
            color: #155724;
        }
        .cert-badge.revoked {
            background: #f8d7da;
            color: #721c24;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .info-label {
            font-weight: 600;
            color: #555;
            min-width: 120px;
        }
        .info-value {
            color: #333;
            word-break: break-all;
            text-align: right;
        }
        .btn-back {
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: block;
            width: 100%;
            margin-top: 20px;
        }
        .btn-back:hover {
            background: #667eea;
            color: white;
        }
        .attachment-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .attachment-link:hover {
            text-decoration: underline;
        }
        #cert-info {
            min-height: 100px;
        }
    </style>
</head>
<body>

<div class="cert-container">
    <div class="cert-header">
        <h1 class="cert-title">📜 学业证书详情</h1>
    </div>
    
    <div id="cert-info">
        <div class="text-center py-4">
            <div class="spinner-border text-primary"></div>
            <p class="mt-2">加载中...</p>
        </div>
    </div>
    
    <button class="btn-back" onclick="window.location.href='index.html'">⬅ 返回首页</button>
</div>

    <script>
        const CONTRACT_ADDRESS = "0xCDfB0ac100DE0c1D5e4eEc8554E7Eb2496317251"; // ⚠️ 替换
        const CONTRACT_ABI = [
            "function getCredentialById(uint _id) view returns (tuple(uint,string,address,uint8,string,string,uint,string,bool,address))"
        ];

        async function loadCert() {
    // 手动解析 URL 参数，避免 URLSearchParams 兼容问题
    const queryString = window.location.search.substring(1);
    const pairs = queryString.split('&');
    const params = {};
    pairs.forEach(p => {
        const [key, val] = p.split('=');
        if (key) params[key] = decodeURIComponent(val || '');
    });
    const id = params.id;
    const student = params.student;
    console.log("接收到的参数 - id:", id, "student:", student);

    if (!id || !student) {
        document.getElementById("cert-info").innerText = "参数错误：缺少id或student";
        return;
    }

    const provider = new ethers.providers.JsonRpcProvider("https://sepolia.infura.io/v3/7127636f97a94091924038bf5c09d8d9");
    const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, provider);

    try {
        const c = await contract.getCredentialById(id);
        if (c[2].toLowerCase() !== student.toLowerCase()) {
            document.getElementById("cert-info").innerText = "该证书不属于此学生";
            return;
        }
        const certTypes = ['毕业证','学位证','成绩单','竞赛','其他'];
        const html = `
            <div class="detail"><b>证书ID：</b>${c[0]}</div>
            <div class="detail"><b>学号：</b>${c[1]}</div>
            <div class="detail"><b>学生地址：</b>${c[2]}</div>
            <div class="detail"><b>证书类型：</b>${certTypes[c[3]]}</div>
            <div class="detail"><b>签发机构：</b>${c[4]}</div>
            <div class="detail"><b>专业：</b>${c[5]}</div>
            <div class="detail"><b>签发日期：</b>${new Date(c[6] * 1000).toLocaleDateString()}</div>
            <div class="detail"><b>状态：</b>${c[8] ? '✅有效' : '❌已撤销'}</div>
            ${c[7] ? `<div class="detail"><b>附件：</b><a href="${c[7].replace('ipfs://','https://ipfs.io/ipfs/')}" target="_blank">查看原件</a></div>` : ''}
        `;
        document.getElementById("cert-info").innerHTML = html;
    } catch (e) {
        console.error(e);
        document.getElementById("cert-info").innerText = "加载失败，请检查证书ID或网络连接";
    }
}

        window.addEventListener('load', loadCert);
    </script>
</body>
</html>
