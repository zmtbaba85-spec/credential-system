<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>证书核验 - 验证方</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Ethers.js -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
            max-width: 900px;
            margin: 40px auto;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .cert-result-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 5px solid #28a745;
            transition: all 0.3s ease;
        }
        .cert-result-card.revoked {
            border-left-color: #dc3545;
            opacity: 0.7;
        }
        .cert-result-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }
        .badge-valid {
            background: #28a745;
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
        }
        .badge-revoked {
            background: #dc3545;
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
        }
        .qr-code-img {
            width: 120px;
            height: 120px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            padding: 5px;
            background: white;
        }
        .attachment-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .attachment-link:hover {
            text-decoration: underline;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #6c757d;
        }
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="main-container">
    <!-- 头部 -->
    <div class="header-row">
        <h1 class="h3 mb-0">🔍 证书真伪验证</h1>
        <button class="btn btn-outline-secondary" onclick="window.location.href='index.html'">⬅ 返回首页</button>
    </div>
    
    <!-- 说明 -->
    <div class="alert alert-info">
        <strong>无需钱包 · 公开验证</strong>：输入任意学生钱包地址，即可查看其所有已存证的证书，并可通过二维码扫码验证真伪。
    </div>

    <!-- 查询区域 -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row g-2 align-items-center">
                <div class="col-md-8">
                    <input type="text" class="form-control" id="student-address" placeholder="请输入学生钱包地址，例如 0x...">
                </div>
                <div class="col-md-4">
                    <button class="btn btn-primary w-100" onclick="verifyByAddress()">🔎 查询证书</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 查询结果 -->
    <div id="verify-result">
        <div class="text-center text-muted py-4">
            <div>📭</div>
            <p>请输入学生地址进行查询</p>
        </div>
    </div>
</div>

    <script>
        // ================== 配置区 ==================
        const CONTRACT_ADDRESS = "0xCDfB0ac100DE0c1D5e4eEc8554E7Eb2496317251"; // ⚠️ 替换为你的 Sepolia 合约地址
        const INFURA_ID = "7127636f97a94091924038bf5c09d8d9";             // ⚠️ 替换为你的 Infura 项目 ID
        const RPC_URL = `https://sepolia.infura.io/v3/${INFURA_ID}`;

        const CONTRACT_ABI = [
            "function getCredentialsByAddress(address) view returns (tuple(uint,string,address,uint8,string,string,uint,string,bool,address)[] memory)"
        ];

        // 初始化 provider 和 contract（无需钱包）
        const provider = new ethers.providers.JsonRpcProvider(RPC_URL);
        const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, provider);

        // ================== 查询函数 ==================
        async function verifyByAddress() {
            const addr = document.getElementById("student-address").value.trim();
            const el = document.getElementById("verify-result");
            if (!ethers.utils.isAddress(addr)) {
                el.innerHTML = "请输入有效的以太坊地址";
                return;
            }
            el.innerHTML = "查询中...";
            try {
                const creds = await contract.getCredentialsByAddress(addr);
                if (creds.length === 0) {
                    el.innerHTML = "该地址暂无存证证书";
                    return;
                }
                let html = "";
                const certTypes = ['毕业证','学位证','成绩单','竞赛','其他'];
                const basePath = window.location.pathname.includes('/credential-system/') ? '/credential-system/' : '/';

                for (let i = 0; i < creds.length; i++) {
                    const c = creds[i];
                    const certType = certTypes[c[3]];
                    const issueDate = new Date(c[6] * 1000).toLocaleDateString();
                    const valid = c[8] ? '✅有效' : '❌已撤销';
                    let certLink = '';
                    if (c[7] && c[7] !== '') {
                        const ipfsUrl = c[7].replace('ipfs://', 'https://ipfs.io/ipfs/');
                        certLink = ` <a href="${ipfsUrl}" target="_blank">查看原件</a>`;
                    }
                    const shareUrl = `${window.location.origin}${basePath}certificate.html?id=${c[0]}&student=${c[2]}`;
                    html += `
                        <div style="margin:10px; padding:10px; border:1px solid #ddd;">
                            <div><b>证书ID:</b> ${c[0]} | <b>学号:</b> ${c[1]} | <b>类型:</b> ${certType} | <b>机构:</b> ${c[4]} | <b>日期:</b> ${issueDate} | ${valid} ${certLink}</div>
                            <img id="qr-${i}" style="width:100px; height:100px;" alt="二维码">
                        </div>`;
                }
                el.innerHTML = html;

                // 设置二维码图片地址
                for (let i = 0; i < creds.length; i++) {
                    const c = creds[i];
                    const shareUrl = `${window.location.origin}${basePath}certificate.html?id=${c[0]}&student=${c[2]}`;
                    const qrImg = document.getElementById(`qr-${i}`);
                    if (qrImg) {
                        qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(shareUrl)}`;
                    }
                }
            } catch (e) {
                console.error(e);
                el.innerHTML = "查询失败，请检查网络或合约地址";
            }
        }
    </script>
</body>
</html>
