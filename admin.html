<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>证书签发管理 - 管理员</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Ethers.js -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    
    <!-- ExcelJS -->
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
            max-width: 1100px;
            margin: 40px auto;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .card-custom {
            border: none;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }
        .card-header-custom {
            border-radius: 12px 12px 0 0 !important;
            font-weight: 600;
            padding: 12px 20px;
        }
        .cert-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-left: 4px solid #0d6efd;
        }
        .cert-item.revoked {

            opacity: 0.7;
        }
        .btn-action {

        }

</head>
<body>

<div class="main-container">
    <!-- 头部 -->
    <div class="header-row">
        <h1 class="h3 mb-0">📜 证书签发管理</h1>
        <button class="btn btn-outline-secondary" onclick="window.location.href='index.html'">⬅ 返回首页</button>

    <!-- 管理员地址 -->
    <div class="alert alert-light border">
        <strong>管理员地址：</strong><span id="admin-address" class="font-monospace">未连接</span>

    <!-- 签发新证书 -->
    <div class="card card-custom">
        <div class="card-header card-header-custom bg-primary text-white">
            <h5 class="card-title mb-0">✍️ 签发新证书</h5>
        </div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-6">
                    <input type="text" class="form-control" id="student-id" placeholder="学号/身份证号">
                </div>
                <div class="col-md-6">
                    <input type="text" class="form-control" id="student-addr" placeholder="学生钱包地址">

            </div>

                        <option value="1">学位证</option>
                        <option value="2">成绩单</option>
                        <option value="3">竞赛获奖证明</option>

                <div class="col-md-4">

            <div class="mt-3">

            <div class="mt-2">
                <input type="text" class="form-control" id="metadata" placeholder="或手动输入 IPFS 链接（留空自动上传）">
            </div>
            <button class="btn btn-success mt-3" onclick="issueCredential()">
                ✅ 签发证书
            </button>
        </div>
    </div>

    <!-- 批量签发 -->
    <div class="card card-custom">
        <div class="card-header card-header-custom bg-warning text-dark">
            <h5 class="card-title mb-0">📚 批量签发证书</h5>
        </div>
        <div class="card-body">
            <p class="text-muted small">
                支持上传 Excel 文件（.xlsx, .xls），或手动输入文本<br>
                每行一个学生：<b>学号,钱包地址,证书类型(0-4),签发机构,专业,IPFS链接(可选)</b>
            </p>
            <div class="d-flex flex-wrap gap-2 mb-3">
                <button class="btn btn-primary" onclick="downloadTemplate()">📥 下载 Excel 模板</button>
                <input type="file" id="excel-file" accept=".xlsx, .xls" class="form-control w-auto">
                <button class="btn btn-info text-white" onclick="importExcel()">📤 导入并填充</button>
            </div>
            <textarea id="batch-input" rows="5" class="form-control" placeholder="导入后自动填充，也可手动修改"></textarea>
            <button class="btn btn-warning mt-3" onclick="batchIssueCredentials()">📦 批量签发</button>
        </div>
    </div>

    <!-- 已签发证书列表 -->
    <div class="card card-custom">
        <div class="card-header card-header-custom bg-success text-white d-flex justify-content-between align-items-center">
            <h5 class="card-title mb-0">📋 已签发证书列表</h5>
            <button class="btn btn-light btn-sm" onclick="loadAllCredentials()">🔄 刷新</button>
        </div>
        <div class="card-body" id="credential-list">
            <p class="text-muted text-center">请先连接钱包</p>
        </div>
    </div>

    <!-- 管理员管理 -->
    <div class="card card-custom" id="admin-section">
        <div class="card-header card-header-custom bg-secondary text-white">
            <h5 class="card-title mb-0">👥 管理员管理</h5>
        </div>

        <div class="card-body">
            <div class="d-flex align-items-center gap-3 mb-3">
                <span>当前角色：</span>
                <span class="badge-role bg-primary text-white" id="my-role"></span>
            </div>
            <button class="btn btn-outline-secondary btn-sm" id="toggle-admin-btn" onclick="showAdminForm()">➕ 添加/移除管理员</button>
            <button class="btn btn-outline-secondary btn-sm ms-2" onclick="loadAdminList()">🔄 刷新管理员列表</button>
            <div id="admin-form" style="display:none;" class="mt-3">
                <div class="input-group">
                    <input type="text" class="form-control" id="new-admin-addr" placeholder="输入管理员地址">
                    <div id="admin-actions" class="d-flex gap-1 ms-2"></div>
                </div>
            </div>
            <div id="admin-list" class="mt-3"></div>
        </div>
    </div>

    <!-- 审计日志 -->
    <div class="card card-custom">
        <div class="card-header card-header-custom bg-dark text-white d-flex justify-content-between align-items-center">
            <h5 class="card-title mb-0">📋 操作审计日志</h5>
            <button class="btn btn-light btn-sm" id="load-audit-btn" onclick="loadAuditLog()">📊 加载记录</button>
        </div>
        <div class="card-body" id="audit-log">
            <p class="text-muted text-center">点击按钮加载</p>
        </div>
    </div>

</div>



    <script>

        const PINATA_JWT = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySW5mb3JtYXRpb24iOnsiaWQiOiI0ZmU4YTBiMy03MjE3LTRkNDYtOTFhMS1iY2UyODMyNmI0OGYiLCJlbWFpbCI6InptdGJhYmE4NUBnbWFpbC5jb20iLCJlbWFpbF92ZXJpZmllZCI6dHJ1ZSwicGluX3BvbGljeSI6eyJyZWdpb25zIjpbeyJkZXNpcmVkUmVwbGljYXRpb25Db3VudCI6MSwiaWQiOiJGUkExIn0seyJkZXNpcmVkUmVwbGljYXRpb25Db3VudCI6MSwiaWQiOiJOWUMxIn1dLCJ2ZXJzaW9uIjoxfSwibWZhX2VuYWJsZWQiOmZhbHNlLCJzdGF0dXMiOiJBQ1RJVkUifSwiYXV0aGVudGljYXRpb25UeXBlIjoic2NvcGVkS2V5Iiwic2NvcGVkS2V5S2V5IjoiNDIxZWZkMGU3OTAxNzgwZDMxOWEiLCJzY29wZWRLZXlTZWNyZXQiOiJlOGVmZGEyNDI3ZDc5ZWYxNGM1NGFkZjg5N2Y4NTg4NmEyNzA1NjZlZjc0ZTJlMjY5MmZhNDhjNTJhN2QyNjdlIiwiZXhwIjoxODEwMTIzMjM5fQ.xIfS5LZFiyBl90Ltyt9Ly-guupUyCF-HOd-fZWoqkcQ"; // ⚠️ 粘贴从Pinata获取的JWT

        // 页面加载时自动初始化
async function init() {
    if (!window.ethereum) {
        alert("请安装MetaMask并返回首页连接钱包");
        return;
    }
    try {
        const accounts = await window.ethereum.request({ method: 'eth_accounts' });
        if (accounts.length === 0) {
            alert("未检测到已连接钱包，请返回首页连接");
            window.location.href = "index.html";
            return;
        }
        userAddress = accounts[0];
        provider = new ethers.providers.Web3Provider(window.ethereum);
        signer = provider.getSigner();
        contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
        document.getElementById("admin-address").innerText = userAddress;

        // 先检查角色，避免非管理员进入管理页
        const role = await contract.admins(userAddress);
        if (role === 0) { // None，非管理员
            window.location.href = "student.html";
            return;
        }

        // 是管理员，继续加载管理员数据
        await loadAllCredentials();
        await loadMyRole();
        await loadAdminList();
    } catch (e) {
        console.error("初始化失败", e);
        alert("初始化失败，请检查网络");
    }
}

window.addEventListener('load', init);

async function loadMyRole() {
    try {
        const role = await contract.admins(userAddress);
        const roleNames = { 1: "超级管理员", 2: "父管理员", 3: "子管理员" };
        document.getElementById("my-role").innerText = roleNames[role] || "非管理员";

        const toggleBtn = document.getElementById("toggle-admin-btn");
        const actionsDiv = document.getElementById("admin-actions");
        const adminForm = document.getElementById("admin-form");

        if (role === 1 || role === 2) {
            // 超级管理员或父管理员：显示管理按钮
            toggleBtn.style.display = "inline-block";
            if (role === 1) {
                actionsDiv.innerHTML = `
                    <button onclick="addParentAdmin()">添加父管理员</button>
                    <button onclick="addChildAdmin()">添加子管理员</button>
                    <button onclick="removeAdmin()">移除管理员（父/子）</button>
                `;
            } else {
                actionsDiv.innerHTML = `
                    <button onclick="addChildAdmin()">添加子管理员</button>
                    <button onclick="removeAdmin()">移除子管理员</button>
                `;
            }
        } else {
            // 子管理员：隐藏操作入口，清空表单内容
            toggleBtn.style.display = "none";
            actionsDiv.innerHTML = "";
            adminForm.style.display = "none";
        }

        // 刷新管理员列表（所有角色均可查看）
        await loadAdminList();
    } catch (e) {
        console.error("获取角色失败", e);
    }
}
        

        // ================== 钱包连接 ==================
        async function connectWallet() {
            await window.ethereum.request({ method: 'eth_requestAccounts' });
            provider = new ethers.providers.Web3Provider(window.ethereum);
            signer = provider.getSigner();
            contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
            document.getElementById("admin-address").innerText = await signer.getAddress();
        }

        // ================== 上传文件到IPFS（Pinata） ==================
        async function uploadToIPFS(file) {
            const formData = new FormData();
            formData.append('file', file);

            const metadata = JSON.stringify({
                name: file.name
            });
            formData.append('pinataMetadata', metadata);

            const options = JSON.stringify({
                cidVersion: 0
            });
            formData.append('pinataOptions', options);

            const response = await fetch('https://api.pinata.cloud/pinning/pinFileToIPFS', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${PINATA_JWT}`
                },
                body: formData
            });

            if (!response.ok) {
                const errorBody = await response.text();
                throw new Error(`上传失败: ${response.status} ${errorBody}`);
            }

            const result = await response.json();
            return `ipfs://${result.IpfsHash}`;
        }

        // ================== 签发证书 ==================
        async function issueCredential() {
            const studentId = document.getElementById("student-id").value.trim();
            const studentAddr = document.getElementById("student-addr").value.trim();
            const certType = parseInt(document.getElementById("cert-type").value);
            const issuer = document.getElementById("issuer").value.trim();
            const major = document.getElementById("major").value.trim();
            let metadataURI = document.getElementById("metadata").value.trim();

            if (!studentId || !studentAddr) { alert("学号和学生地址为必填项"); return; }

            // 检查是否有文件上传
            const fileInput = document.getElementById("cert-file");
            const file = fileInput.files[0];
            const uploadStatus = document.getElementById("upload-status");

            if (file && !metadataURI) {
                // 如果有文件且未手动填写链接，则自动上传
                uploadStatus.innerText = "正在上传文件到 IPFS...";
                try {
                    metadataURI = await uploadToIPFS(file);
                    uploadStatus.innerText = "上传成功！";
                } catch (e) {
                    uploadStatus.innerText = "上传失败：" + e.message;
                    alert("文件上传失败，请重试或手动填写链接");
                    return;
                }
            }

            try {
                const tx = await contract.issueCredential(
                    studentId,
                    studentAddr,
                    certType,
                    issuer,
                    major,
                    metadataURI,
                    { gasLimit: 500000 }
                );
                await tx.wait();
                alert("证书签发成功！");
                // 清空表单
                document.getElementById("student-id").value = "";
                document.getElementById("student-addr").value = "";
                document.getElementById("issuer").value = "";
                document.getElementById("major").value = "";
                document.getElementById("metadata").value = "";
                fileInput.value = "";
                uploadStatus.innerText = "";
                await loadAllCredentials();
            } catch (e) {
                alert("签发失败：" + (e.reason || e.message));
            }
        }

        // ================== 加载所有证书 ==================
        async function loadAllCredentials() {
    const el = document.getElementById("credential-list");
    if (!contract) { el.innerHTML = "请先连接钱包"; return; }
    el.innerHTML = "加载中...";
    try {
        const creds = await contract.callStatic.getMyIssuedCredentials();
        if (creds.length === 0) { el.innerHTML = "暂无您签发的证书"; return; }
        let html = "";
        creds.forEach(c => {
            const id = c[0];
            const studentId = c[1];
            const certTypeNames = ['毕业证','学位证','成绩单','竞赛','其他'];
            const certType = certTypeNames[c[3]] || '其他';
            const issuer = c[4];
            const issueDate = new Date(c[6] * 1000).toLocaleString();
            const valid = c[8];
            const statusText = valid ? '✅有效' : '❌已撤销';
            const metadataLink = c[7] ? ` <a href="${c[7].replace('ipfs://','https://ipfs.io/ipfs/')}" target="_blank">查看附件</a>` : '无附件';
            const revokeBtn = valid ? ` <button onclick="revokeCredential(${id})" style="color:red; margin-left:10px;">撤销</button>` : '';
            html += `<div style="margin:5px 0;">
                <b>ID:</b>${id} | <b>学号:</b>${studentId} | <b>类型:</b>${certType} | <b>机构:</b>${issuer} | <b>日期:</b>${issueDate} | ${statusText} ${metadataLink} ${revokeBtn}
            </div>`;
        });
        el.innerHTML = html;
    } catch (e) {
        console.error(e);
        el.innerHTML = "加载失败，请查看控制台。";
    }
}

//撤销证书
async function revokeCredential(id) {
    if (!confirm(`确定撤销证书 ID: ${id} 吗？此操作不可逆！`)) return;
    try {
        const tx = await contract.revokeCredential(id, { gasLimit: 100000 });
        await tx.wait();
        alert(`证书 ID: ${id} 已撤销`);
        await loadAllCredentials(); // 刷新列表
    } catch (e) {
        console.error(e);
        alert("撤销失败：" + (e.reason || e.message));
    }
}

function showAdminForm() {
    const form = document.getElementById("admin-form");
    form.style.display = form.style.display === 'none' ? 'block' : 'none';
}

// 添加管理员
async function addParentAdmin() {
    const addr = document.getElementById("new-admin-addr").value.trim();
    if (!ethers.utils.isAddress(addr)) return alert("无效地址");
    try {
        const tx = await contract.addParentAdmin(addr, { gasLimit: 100000 });
        await tx.wait();
        alert("父管理员添加成功！");
        document.getElementById("new-admin-addr").value = "";
        await loadAdminList();
    } catch (e) {
        alert("操作失败：" + (e.reason || e.message));
    }
}

async function addChildAdmin() {
    const addr = document.getElementById("new-admin-addr").value.trim();
    if (!ethers.utils.isAddress(addr)) return alert("无效地址");
    try {
        const tx = await contract.addChildAdmin(addr, { gasLimit: 100000 });
        await tx.wait();
        alert("子管理员添加成功！");
        document.getElementById("new-admin-addr").value = "";
        await loadAdminList();
    } catch (e) {
        alert("操作失败：" + (e.reason || e.message));

}
// 移除管理员
async function removeAdmin() {
    const addr = document.getElementById("new-admin-addr").value.trim();
    if (!ethers.utils.isAddress(addr)) return alert("无效地址");
    if (addr.toLowerCase() === userAddress.toLowerCase()) return alert("不能移除自己");
    if (!confirm(`确定移除管理员 ${addr} 吗？`)) return;
    try {
        const tx = await contract.removeAdmin(addr, { gasLimit: 100000 });
        await tx.wait();
        alert(`已移除管理员：${addr}`);
        document.getElementById("new-admin-addr").value = "";
    } catch (e) {
        alert("操作失败：" + (e.reason || e.message));
    }
}

async function loadAdminList() {
    const el = document.getElementById("admin-list");
    if (!contract) { el.innerHTML = ""; return; }
    try {
        const [addrs, roles] = await contract.getAdminList();
        if (addrs.length === 0) {
            el.innerHTML = "暂无管理员";
            return;
        }

        // 获取当前用户角色，用于过滤
        const myRole = await contract.getMyRole();
        const roleNames = { 1: "超级管理员", 2: "父管理员", 3: "子管理员" };
        
        const adminsArray = [];
        for (let i = 0; i < addrs.length; i++) {
            if (addrs[i].toLowerCase() === userAddress.toLowerCase()) continue;
            const addrRole = roles[i];
            if (myRole === 1) {
                // 超级管理员显示所有
            } else if (myRole === 2) {
                if (addrRole === 1) continue; // 父管理员不看超级管理员
            } else if (myRole === 3) {
                if (addrRole !== 3) continue; // 子管理员只看子管理员
            }
            adminsArray.push({ addr: addrs[i], role: addrRole });
        }

        // 排序：父管理员在上，子管理员在下，同角色保持添加顺序
        adminsArray.sort((a, b) => {
            if (a.role === 2 && b.role === 3) return -1;
            if (a.role === 3 && b.role === 2) return 1;
            return 0;
        });

        if (adminsArray.length === 0) {
            el.innerHTML = "暂无符合条件的管理员";
            return;
        }
        let html = "<ul>";
        for (const item of adminsArray) {
            html += `<li>${item.addr} — ${roleNames[item.role] || '未知'}</li>`;
        }
        html += "</ul>";
        el.innerHTML = html;
    } catch (e) {
        console.error(e);
        el.innerHTML = "加载管理员列表失败";
    }
}

// ================== 审计日志 ==================
async function loadAuditLog() {
    const el = document.getElementById("audit-log");
    if (!contract) { el.innerHTML = "请先连接钱包"; return; }
    const btn = document.getElementById("load-audit-btn");
    btn.disabled = true;
    btn.innerText = "加载中...";
    el.innerHTML = "正在查询链上事件...";

    try {
        // 计算事件签名哈希
        const topicIssued = ethers.utils.id("CredentialIssued(uint256,address,uint8,uint256)");
        const topicRevoked = ethers.utils.id("CredentialRevoked(uint256)");
        const topicAdminAdded = ethers.utils.id("AdminAdded(address,uint8)");
        const topicAdminRemoved = ethers.utils.id("AdminRemoved(address)");

        const currentBlock = await provider.getBlockNumber();
        const fromBlock = Math.max(currentBlock - 5000, 0);

        const logs = await provider.getLogs({
            fromBlock,
            toBlock: currentBlock,
            address: CONTRACT_ADDRESS,
            topics: [ [topicIssued, topicRevoked, topicAdminAdded, topicAdminRemoved] ]
        });

        if (logs.length === 0) {
            el.innerHTML = "暂无操作记录";
            btn.disabled = false;
            btn.innerText = "加载最近操作记录";
            return;
        }

        // 解码事件
        const events = logs.map(log => {
            const topic = log.topics[0];
            if (topic === topicIssued) {
                // 索引参数: id (topics[1]), student (topics[2])，非索引参数: certType (uint8), timestamp (uint256) 在 data 中
                const decodedData = ethers.utils.defaultAbiCoder.decode(
                    ["uint8", "uint256"],
                    log.data
                );
                return {
                    type: '证书签发',
                    blockNumber: log.blockNumber,
                    transactionHash: log.transactionHash,
                    student: ethers.utils.getAddress(log.topics[2].slice(26)), // 提取 address
                    certId: ethers.BigNumber.from(log.topics[1]).toString(),
                    certType: decodedData[0],
                    timestamp: decodedData[1].toNumber()
                };
            } else if (topic === topicRevoked) {
                // 索引参数: id (topics[1])
                return {
                    type: '证书撤销',
                    blockNumber: log.blockNumber,
                    transactionHash: log.transactionHash,
                    certId: ethers.BigNumber.from(log.topics[1]).toString()
                };
            } else if (topic === topicAdminAdded) {
                // 索引参数: addr (topics[1])，非索引参数: role (uint8) 在 data 中
                const decodedData = ethers.utils.defaultAbiCoder.decode(
                    ["uint8"],
                    log.data
                );
                return {
                    type: '添加管理员',
                    blockNumber: log.blockNumber,
                    transactionHash: log.transactionHash,
                    addr: ethers.utils.getAddress(log.topics[1].slice(26)),
                    role: decodedData[0]
                };
            } else if (topic === topicAdminRemoved) {
                // 索引参数: addr (topics[1])，无 data
                return {
                    type: '移除管理员',
                    blockNumber: log.blockNumber,
                    transactionHash: log.transactionHash,
                    addr: ethers.utils.getAddress(log.topics[1].slice(26))
                };
            }
        }).filter(Boolean); // 去除 undefined

        events.sort((a, b) => a.blockNumber - b.blockNumber);

        // 渲染表格
        let html = `<table border="1" cellpadding="6" style="border-collapse: collapse; width: 100%; font-size: 14px;">
            <tr style="background: #f0f0f0;">
                <th>区块</th>
                <th>类型</th>
                <th>详情</th>
                <th>交易</th>
            </tr>`;

        for (const ev of events) {
            let detail = '';
            if (ev.type === '证书签发') {
                detail = `学生: ${ev.student?.slice(0,10)}...，证书ID: ${ev.certId}`;
            } else if (ev.type === '证书撤销') {
                detail = `证书ID: ${ev.certId}`;
            } else if (ev.type === '添加管理员') {
                const roleMap = { 1: '超级管理员', 2: '父管理员', 3: '子管理员' };
                detail = `地址: ${ev.addr?.slice(0,10)}...，角色: ${roleMap[ev.role] || ev.role}`;
            } else if (ev.type === '移除管理员') {
                detail = `地址: ${ev.addr?.slice(0,10)}...`;
            }

            html += `<tr>
                <td>${ev.blockNumber}</td>
                <td>${ev.type}</td>
                <td>${detail}</td>
                <td><a href="https://sepolia.etherscan.io/tx/${ev.transactionHash}" target="_blank">查看</a></td>
            </tr>`;
        }
        html += '</table>';
        el.innerHTML = html;
    } catch (e) {
        console.error(e);
        el.innerHTML = "加载失败：" + e.message;
    } finally {
        btn.disabled = false;
        btn.innerText = "加载最近操作记录";
    }
}
// 加载当前所有管理员（简单展示）
async function batchIssueCredentials() {
    const raw = document.getElementById("batch-input").value.trim();
    if (!raw) { alert("请输入学生信息"); return; }

    const lines = raw.split('\n').filter(line => line.trim() !== '');
    const studentIds = [], addresses = [], certTypes = [], issuers = [], majors = [], metadatas = [];

    for (let i = 0; i < lines.length; i++) {
        // 关键修改：把中文逗号替换为英文逗号，再进行分割
        const normalizedLine = lines[i].replace(/，/g, ',');  // ← 统一逗号
        const parts = normalizedLine.split(',');
        if (parts.length < 5) {
            alert(`第 ${i+1} 行格式不正确，至少需要5个字段（学号,地址,类型,机构,专业）`);
            return;
        }
        const [studentId, addr, certType, issuer, major, metadata] = parts.map(s => s.trim());
        if (!ethers.utils.isAddress(addr)) {
            alert(`第 ${i+1} 行地址 "${addr}" 无效`);
            return;
        }
        const typeNum = parseInt(certType);
        if (isNaN(typeNum) || typeNum < 0 || typeNum > 4) {
            alert(`第 ${i+1} 行证书类型 "${certType}" 无效（0-4）`);
            return;
        }
        studentIds.push(studentId);
        addresses.push(addr);
        certTypes.push(typeNum);
        issuers.push(issuer);
        majors.push(major);
        metadatas.push(metadata || ""); // IPFS链接可选
    }

    if (!confirm(`将为 ${lines.length} 名学生批量签发证书，确认吗？`)) return;

    try {
        const tx = await contract.batchIssueCredentials(
            studentIds,
            addresses,
            certTypes,
            issuers,
            majors,
            metadatas,
            { gasLimit: 200000 * lines.length + 500000 }
        );
        await tx.wait();
        alert(`批量签发成功！共 ${lines.length} 份证书。`);
        document.getElementById("batch-input").value = "";
        await loadAllCredentials(); // 刷新列表
    } catch (e) {
        console.error(e);
        alert("批量签发失败：" + (e.reason || e.message));
    }
}
 

async function downloadTemplate() {
    const workbook = new ExcelJS.Workbook();
    const sheet = workbook.addWorksheet('批量签发模板');

    // 定义列
    sheet.columns = [
        { header: '学号', key: 'studentId', width: 15 },
        { header: '钱包地址', key: 'address', width: 42 },
        { header: '证书类型(0-4)', key: 'certType', width: 16 },
        { header: '签发机构', key: 'issuer', width: 20 },
        { header: '专业', key: 'major', width: 20 },
        { header: 'IPFS链接(可选)', key: 'metadata', width: 30 }
    ];

    // 添加示例数据行
    const exampleRow = sheet.addRow(['2024001', '0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC', '0', 'XX大学', '计算机科学', '']);
    // 设置第二行（示例行）背景色为黄色
    exampleRow.eachCell(cell => {
        cell.fill = {
            type: 'pattern',
            pattern: 'solid',
            fgColor: { argb: 'FFFFFF00' } // 黄色
        };
    });


    // 生成文件并下载
    const buffer = await workbook.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '批量签发模板.xlsx';
    a.click();
    URL.revokeObjectURL(url);
}
 
async function importExcel() {
    const fileInput = document.getElementById("excel-file");
    const file = fileInput.files[0];
    if (!file) {
        alert("请先选择一个 Excel 文件");
        return;
    }

    try {
        const workbook = new ExcelJS.Workbook();
        const arrayBuffer = await file.arrayBuffer();
        await workbook.xlsx.load(arrayBuffer);
        const worksheet = workbook.worksheets[0];
        const rows = [];

        worksheet.eachRow({ includeEmpty: false }, (row) => {
            const rowData = [];
            for (let i = 1; i <= 6; i++) {
                const cell = row.getCell(i);
                rowData.push(cell.value ? cell.value.toString().trim() : '');
            }
            rows.push(rowData);
        });

        if (rows.length === 0) {
            alert("Excel 文件为空");
            return;
        }

        // 跳过策略：第一行如果是表头，跳过；第二行如果是示例（固定跳过），跳过
        let dataStartRow = 0;
        const headerKeywords = ['学号', '地址', '钱包', '类型', '机构', 'student', 'address', 'wallet'];
        const firstRow = rows[0];
        const isHeader = headerKeywords.some(keyword =>
            firstRow.some(cell => cell.includes(keyword))
        );

        // 如果有表头，从第3行开始（跳过第1行表头和第2行示例）
        if (isHeader) {
            dataStartRow = 2; // 跳过第1行(表头)和第2行(示例)
        } else {
            // 如果没有表头，也强制跳过第2行（示例行），从第3行开始
            // 但如果只有1行或2行，则无数据
            dataStartRow = 2;
        }

        const lines = [];
        for (let i = dataStartRow; i < rows.length; i++) {
            const row = rows[i];
            const [studentId, addr, certType, issuer, major, metadata] = row;

            if (!studentId || !addr || certType === '' || !issuer || !major) {
                console.warn(`第 ${i+1} 行数据不完整，跳过`);
                continue;
            }
            if (!ethers.utils.isAddress(addr)) {
                console.warn(`第 ${i+1} 行地址无效，跳过`);
                continue;
            }
            const typeNum = parseInt(certType);
            if (isNaN(typeNum) || typeNum < 0 || typeNum > 4) {
                console.warn(`第 ${i+1} 行证书类型无效，跳过`);
                continue;
            }
            lines.push(`${studentId},${addr},${certType},${issuer},${major},${metadata || ''}`);
        }

        if (lines.length === 0) {
            alert("Excel 中没有找到有效数据，请检查格式");
            return;
        }

        document.getElementById("batch-input").value = lines.join('\n');
        alert(`成功解析 ${lines.length} 条记录，已填充到文本框。`);
    } catch (err) {
        console.error(err);
        alert("Excel 解析失败：" + err.message);
    }
}
