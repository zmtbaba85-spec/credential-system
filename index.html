<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>学业证书存证系统 - 入口</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Ethers.js -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 50px 40px;
            max-width: 600px;
            width: 90%;
            text-align: center;
        }
        .system-title {
            font-size: 2rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }
        .system-subtitle {
            font-size: 1rem;
            color: #666;
            margin-bottom: 30px;
        }
        .btn-connect {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: white;
            padding: 14px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            display: block;
            width: 100%;
            margin-bottom: 15px;
        }
        .btn-connect:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
            color: white;
        }
        .btn-verifier {
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            padding: 12px 40px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            transition: all 0.3s ease;
            display: block;
            width: 100%;
        }
        .btn-verifier:hover {
            background: #667eea;
            color: white;
        }
        #status {
            margin-top: 20px;
            font-weight: 500;
            color: #555;
            min-height: 24px;
        }
        .icon-row {
            font-size: 3rem;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="main-card">
    <div class="icon-row">🎓</div>
    <h1 class="system-title">学业证书去中心化存证系统</h1>
    <p class="system-subtitle">基于以太坊区块链 · 安全透明 · 不可篡改</p>
    
    <button id="connect-btn" class="btn-connect" onclick="connectAndEnter()">
        🔗 连接钱包
    </button>
    
    <button class="btn-verifier" onclick="window.location.href='verifier.html'">
        🔍 企业/第三方验证（无需钱包）
    </button>
    
    <p id="status"></p>
</div>

<script>
        // ⚠️ 换成你最新部署的合约地址
        const CONTRACT_ADDRESS = "0x456e9c6124A99e9708Bb107CAdc235f419bD502D";

        // 只需要一个函数获取角色
        const CONTRACT_ABI = [
    "function admins(address) view returns (uint8)"
];

        async function connectAndEnter() {
    if (!window.ethereum) {
        alert("请安装MetaMask钱包！");
        return;
    }
    const status = document.getElementById("status");
    status.innerText = "连接中...";

    try {
        // 1. 请求账户
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        const userAddress = accounts[0];
        const provider = new ethers.providers.Web3Provider(window.ethereum);
        const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, provider);

        // 2. 直接用 admins 映射获取角色
        const result = await contract.admins(userAddress);
        const role = Number(result);
        console.log("角色数字:", role);

        // 3. 根据角色跳转 (0=学生, 1=超级管理员, 2=父管理员, 3=子管理员)
        if (role > 0) {
            window.location.href = "admin.html";
        } else {
            window.location.href = "student.html";
        }
    } catch (e) {
        console.error("连接失败：", e);
        status.innerText = "连接失败，请检查网络或合约地址";
        alert("连接失败：" + (e.reason || e.message));
    }
}
    </script>
</body>
</html>
