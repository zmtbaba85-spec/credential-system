<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的证书 - 学生端</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Ethers.js -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
            max-width: 900px;
            margin: 40px auto;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .cert-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 5px solid #28a745;
            transition: all 0.3s ease;
        }
        .cert-card.revoked {
            border-left-color: #dc3545;
            opacity: 0.7;
        }
        .cert-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }
        .btn-share {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 5px 15px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        .btn-share:hover {
            background: #5a6ed7;
            color: white;
        }
        .badge-valid {
            background: #28a745;
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
        }
        .badge-revoked {
            background: #dc3545;
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
        }
        #student-address {
            font-family: monospace;
            background: #e9ecef;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #6c757d;
        }
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="main-container">
    <!-- 头部 -->
    <div class="header-row">
        <h1 class="h3 mb-0">🎓 我的学业证书</h1>
        <button class="btn btn-outline-secondary" onclick="window.location.href='index.html'">⬅ 返回首页</button>
    </div>
    
    <!-- 学生地址 -->
    <div class="alert alert-light border">
        <strong>学生地址：</strong><span id="student-address">未连接</span>
    </div>

    <!-- 证书列表 -->
    <div class="card">
        <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
            <h5 class="card-title mb-0">📋 我的证书列表</h5>
            <button class="btn btn-light btn-sm" onclick="loadMyCredentials()">🔄 刷新</button>
        </div>
        <div class="card-body" id="my-credentials">
            <p class="text-muted text-center">请先连接钱包</p>
        </div>
    </div>
</div>

<script>
        let provider, signer, contract;
        const CONTRACT_ADDRESS = "0xCDfB0ac100DE0c1D5e4eEc8554E7Eb2496317251";
        const CONTRACT_ABI = [
            "function getMyCredentials() view returns (tuple(uint,string,address,uint8,string,string,uint,string,bool)[] memory)"
        ];

        async function init() {
    if (!window.ethereum) {
        alert("请安装MetaMask并返回首页连接钱包");
        return;
    }
    try {
        const accounts = await window.ethereum.request({ method: 'eth_accounts' });
        if (accounts.length === 0) {
            alert("未检测到钱包，请返回首页连接");
            window.location.href = "index.html";
            return;
        }
        userAddress = accounts[0];
        provider = new ethers.providers.Web3Provider(window.ethereum);
        signer = provider.getSigner();
        contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
        document.getElementById("student-address").innerText = userAddress;
        await loadMyCredentials();
    } catch (e) {
        console.error(e);
        alert("初始化失败");
    }
}

window.addEventListener('load', init);


        async function connectWallet() {
            await window.ethereum.request({ method: 'eth_requestAccounts' });
            provider = new ethers.providers.Web3Provider(window.ethereum);
            signer = provider.getSigner();
            contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
            document.getElementById("student-address").innerText = await signer.getAddress();
            loadMyCredentials();
        }
        
       // const origin = "https://euphemism-poker-manly.ngrok-free.dev"; // 替换为你的 ngrok 地址
        async function loadMyCredentials() {
    const el = document.getElementById("my-credentials");
    if (!contract) { el.innerHTML = "请先连接"; return; }
    el.innerHTML = "加载中...";
    try {
        const creds = await contract.getMyCredentials();
        if (creds.length === 0) { el.innerHTML = "你还没有存证的证书"; return; }
        let html = "";
        creds.forEach(c => {
            const certType = ['毕业证','学位证','成绩单','竞赛','其他'][c[3]];
            const issueDate = new Date(c[6] * 1000).toLocaleDateString();
            const valid = c[8] ? '✅有效' : '❌已撤销';
            let certLink = '';
            if (c[7] && c[7] !== '') {
                const ipfsUrl = c[7].replace('ipfs://', 'https://ipfs.io/ipfs/');
                certLink = ` <a href="${ipfsUrl}" target="_blank">查看原件</a>`;
            }
            const basePath = window.location.pathname.includes('/credential-system/') ? '/credential-system/' : '/';
            const shareLink = `${window.location.origin}${basePath}certificate.html?id=${c[0]}&student=${c[2]}`;
            console.log("生成的链接:", shareLink);
            const shareBtn = `<button onclick="navigator.clipboard.writeText('${shareLink}').then(()=>alert('链接已复制！'))">复制分享链接</button>`;
            html += `<div>证书ID:${c[0]} | 类型:${certType} | 机构:${c[4]} | 日期:${issueDate} | ${valid} ${certLink} ${shareBtn}</div>`;
        });
        el.innerHTML = html;
    } catch (e) {
        console.error(e);
        el.innerHTML = "加载失败";
    }
}

    </script>
</body>
</html>
